name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Bash ${{ matrix.bash }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash: ['3.2', '4.4', '5.2', '5.3']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run regression tests
        env:
          BASH_VERSION_TAG: ${{ matrix.bash }}
        run: |
          docker run --rm -e LC_ALL=C -v "$PWD:/work:ro" -w /work \
            "bash:$BASH_VERSION_TAG" sh -c \
            'apk add --no-cache python3 && su -s /bin/sh nobody -c "bash scripts/test.sh"'

  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.10.0 \
            tesht.sh scripts/*.sh tests/*.tsh examples/*.tsh
